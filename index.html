<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visit Kericho</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* RESET */
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fff;
}

/* HERO */
.hero{
    height:100vh;
    background:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero h1{
    font-size:55px;
    background:rgba(0,0,0,0.5);
    padding:20px;
    border-radius:10px;
}

/* SECTION TITLE */
.section-title{
    text-align:center;
    font-size:35px;
    margin:50px 0 20px;
    color:#0b6623;
}

/* HOTELS */
.hotels{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.hotel-card{
    width:300px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.hotel-card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.hotel-card button{
    width:100%;
    padding:12px;
    border:none;
    background:#0b6623;
    color:white;
    font-size:16px;
    cursor:pointer;
}

/* HIDEOUTS */
.hideouts{
    padding:50px 20px;
    background:#f5f5f5;
}

.hideout-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    width:300px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    background:white;
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card p{
    padding:10px;
    text-align:center;
    font-weight:bold;
}

/* WHATSAPP BUTTON */
.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    padding:15px 20px;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1>Welcome to Kericho Tourism</h1>
</div>

<!-- HOTELS -->
<h2 class="section-title">Hotels</h2>

<div class="hotels">

    <div class="hotel-card">
        <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945">
        <button>Book Now</button>
    </div>

    <div class="hotel-card">
        <img src="https://images.unsplash.com/photo-1542314831-068cd1dbfeeb">
        <button>Book Now</button>
    </div>

</div>

<!-- HIDEOUTS -->
<h2 class="section-title">Hidden Hideouts</h2>

<div class="hideouts">

    <div class="hideout-grid">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6">
            <p>Tea Plantation Trails</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1520962917960-3a0d5f1b7a5b">
            <p>Waterfalls</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
            <p>Hiking Adventures</p>
        </div>

    </div>

</div>

<!-- WHATSAPP BOOKING -->
<a class="whatsapp" href="https://wa.me/254106014944" target="_blank">
    Book on WhatsApp
</a>

</body>
</html>
